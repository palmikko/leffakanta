{% extends "layout.html" %}

{% block title %}Muokkaa elokuvan tietoja{% endblock %}

{% block content %}
<h2>{{ movie.title }}</h2>
<h3>Elokuvan muokkaus</h3>
<form action="/update_movie" method="post">
  <p>
    <label for="title">Elokuvan nimi:</label> <br />
    <input type="text" name="title" id="title" value="{{ movie.title }}" maxlength="50" required />
  </p>
  <p>
    <label for="genre">Genre:</label> <br />
    <input type="text" name="genre" id="genre" value="{{ movie.genre }}" maxlength="50" required />
  </p>
  <p>
    <label for="duration">Kesto minuutteina:</label> <br />
    <input type="number" name="duration" id="duration" value="{{ movie.duration }}"/>
  </p>
  <input type="hidden" name="movie_id" value="{{ movie.id }}"/>
  {% for class in all_classes %}
  <p>
    <label for="class{{ class }}">{{ class }}:</label> <br />
    <select name="classes" id="class{{ class }}">
      <option value="">(valitse)</option>
    {% for option in all_classes[class] %}
      {% if classes[class] == option %}
      <option value="{{ class }}:{{ option }}" selected>{{ option }}</option>
      {% else %}
      <option value="{{ class }}:{{ option }}">{{ option }}</option>
      {% endif %}
    {% endfor %}
    </select>
  </p>
  {% endfor %}
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" value="Päivitä tiedot" />
</form>
<p>
  <a href="/movie/{{ movie.id }}">Takaisin elokuvaan</a>
</p>
{% endblock %}
