{% extends "layout.html" %}

{% block title %}Lisää elokuva{% endblock %}

{% block content %}
<h2>Lisää elokuva</h2>
<form action="/create_movie" method="post">
  <p>
    <label for="title">Elokuvan nimi:</label> <br />
    <input type="text" name="title" id="title" maxlength="50" required />
  </p>
  <p>
    <label for="genre">Genre:</label> <br />
    <input type="text" name="genre" id="genre" maxlength="50" required />
  </p>
  <p>
    <label for="duration">Kesto minuutteina:</label> <br />
    <input type="number" name="duration" id="duration" required />
  </p>
  {% for class in classes %}
  <p>
    <label for="class{{ class }}">{{ class }}:</label> <br />
    <select name="classes" id="class{{ class }}">
      <option value="">(valitse)</option>
    {% for option in classes[class] %}
      <option value="{{ class }}:{{ option }}">{{ option }}</option>
    {% endfor %}
    </select>
  </p>
  {% endfor %}
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" value="Lisää elokuva" />
  </form>
{% endblock %}
