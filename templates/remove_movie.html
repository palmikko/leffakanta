{% extends "layout.html" %}

{% block title %}Tietojen poisto{% endblock %}

{% block content %}
<h2>{{ movie.title }}</h2>
<h3>Elokuvan tietojen poisto</h3>
<p>Halutako varmasti poistaa tämän elokuvan?</p>
<form action="/remove_movie/{{ movie.id }}" method="post">
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" name="remove" value="Poista elokuva">
  <input type="submit" name="back" value="Palaa takaisin">
</form>
<p>
  <a href="/movie/{{ movie.id }}">Takaisin elokuvaan</a>
</p>
{% endblock %}
