{% extends "layout.html" %}

{% block title %}Käyttäjä {{ user.username }}{% endblock %}

{% block content %}
<h2>Käyttäjä {{ user.username }}</h2>
<p>
  Käyttäjällä yhteensä {{ movies | count }} elokuvaa.
</p>
<h2>Elokuvat</h2>
<ul>
  {% for movie in movies %}
  <li><a href="/movie/{{ movie.id }}">{{ movie.title }}</a></li>
  {% endfor %}
</ul>
{% endblock %}
